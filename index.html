<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apex Circuit - 3D Racing Prototype</title>
    <link rel="stylesheet" href="./styles.css" />

    <!--
      No-build ES module loading. The browser resolves these bare specifiers
      at runtime from jsDelivr. No npm install and no bundler are required.
      The end user's browser (with internet) fetches these; the sandbox does not.
    -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
          "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
        }
      }
    </script>
  </head>
  <body>
    <!-- 3D render mount -->
    <div id="app">
      <canvas id="game"></canvas>
    </div>

    <!-- Loading overlay: shown until the first rendered frame -->
    <div id="loading" class="overlay">
      <div class="loading-inner">
        <div class="spinner" aria-hidden="true"></div>
        <p class="loading-text">Loading Apex Circuit&hellip;</p>
      </div>
    </div>

    <!-- Countdown overlay: shown at race start (3 / 2 / 1 / GO) -->
    <div id="countdown" class="overlay hidden">
      <span id="countdown-text">3</span>
    </div>

    <!-- Speed-line overlay: full-viewport vignette whose opacity ramps with
         speed (see CONFIG.fx.speedLines / src/game/logic/speedfx.js). Sits
         below the HUD panels so it never blocks their readability. -->
    <div id="speed-lines" class="overlay speed-lines hidden" aria-hidden="true"></div>

    <!-- Heads-up display -->
    <div id="hud" class="hidden">
      <!-- Dial-style speedometer: an SVG gauge (track arc + redline arc +
           rotating needle) with a digital read-out at its centre. Angles are
           computed by the pure src/game/logic/dial.js helpers. -->
      <div id="hud-speed" class="hud-panel hud-bottom-right dial-panel">
        <svg id="dial-svg" viewBox="0 0 200 120" class="dial-svg">
          <path id="dial-track" class="dial-track" />
          <path id="dial-redline" class="dial-redline" />
          <g id="dial-needle" class="dial-needle">
            <line x1="100" y1="100" x2="100" y2="34" />
            <circle cx="100" cy="100" r="6" />
          </g>
        </svg>
        <div class="dial-readout">
          <span id="speedometer" class="speedometer">0</span>
          <span class="speed-unit">km/h</span>
        </div>
        <div id="gear-indicator" class="gear-indicator">D</div>
      </div>

      <div id="hud-timing" class="hud-panel hud-top-right lap-board">
        <div class="hud-row">
          <span class="hud-label">Lap</span>
          <span id="lap-counter" class="hud-value">1 / 3</span>
        </div>
        <div class="hud-row">
          <span class="hud-label">Time</span>
          <span id="lap-timer" class="hud-value">0:00.000</span>
        </div>
        <div class="hud-row">
          <span class="hud-label">Best</span>
          <span id="best-lap" class="hud-value">--:--.---</span>
        </div>
      </div>

      <!-- Drift callout: a brief "DRIFT!" flash while sliding. -->
      <div id="drift-callout" class="drift-callout hidden">DRIFT!</div>
    </div>

    <!-- Finish panel: shown when the final lap completes -->
    <div id="finish-panel" class="overlay hidden">
      <div class="finish-card">
        <h1 class="finish-title">Finish!</h1>
        <div class="finish-row">
          <span class="finish-label">Total time</span>
          <span id="finish-time" class="finish-value">0:00.000</span>
        </div>
        <div class="finish-row">
          <span class="finish-label">Best lap</span>
          <span id="finish-best" class="finish-value">--:--.---</span>
        </div>
        <div id="finish-lap-list" class="finish-lap-list"></div>
        <p class="finish-hint">Press R to race again</p>
      </div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
